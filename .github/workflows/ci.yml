name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Guile policy + syntax (no Guix needed, ~30 s) ────────────────────────────
  #
  # The Guix home dry-run job was removed: it evaluated the full home configs,
  # which load machine-local checkouts by absolute path at eval time
  # (minde-package.scm -> ~/Projects/minde, samuel's config -> the valsi
  # checkout). Those don't exist on the runner, so the job could never go green.
  # Home/system configs are validated locally via `make qa-all` (time-machine).
  guile-check:
    name: Guile policy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Guile
        run: sudo apt-get install -y --no-install-recommends guile-3.0

      - name: Guile-only script policy
        run: make qa-guile-only
